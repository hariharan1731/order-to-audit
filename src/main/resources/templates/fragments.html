<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' - Order to Audit'">Order to Audit</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav th:fragment="nav" class="navbar navbar-expand-lg navbar-dark bg-dark mb-3">
  <div class="container-fluid">
    <a class="navbar-brand" th:href="@{/}">Order to Audit</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
            aria-controls="menu" aria-expanded="false" aria-label="Menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item" th:if="${nav.sales}"><a class="nav-link" th:href="@{/sales/orders}">My orders</a></li>
        <li class="nav-item" th:if="${nav.admin}"><a class="nav-link" th:href="@{/admin/orders}">Order desk</a></li>
        <li class="nav-item dropdown" th:if="${nav.admin}">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Office</a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" th:href="@{/admin/invoices}">Invoices</a></li>
            <li><a class="dropdown-item" th:href="@{/admin/payments}">Payments</a></li>
            <li><a class="dropdown-item" th:href="@{/admin/customers}">Customers</a></li>
            <li><a class="dropdown-item" th:href="@{/admin/prices}">Prices</a></li>
            <li><a class="dropdown-item" th:href="@{/admin/items}">Items</a></li>
            <li><a class="dropdown-item" th:href="@{/admin/setup}">Recipes and packs</a></li>
            <li><a class="dropdown-item" th:href="@{/users}">Users</a></li>
            <li><a class="dropdown-item" th:href="@{/audit}">Audit log</a></li>
          </ul>
        </li>
        <li class="nav-item" th:if="${nav.production}"><a class="nav-link" th:href="@{/production}">Production</a></li>
        <li class="nav-item" th:if="${nav.stock}"><a class="nav-link" th:href="@{/stock}">Stock</a></li>
        <li class="nav-item" th:if="${nav.reports}"><a class="nav-link" th:href="@{/reports}">Reports</a></li>
        <li class="nav-item" th:if="${nav.owner}"><a class="nav-link" th:href="@{/owner}">Owner</a></li>
      </ul>
      <form th:if="${nav.username != null}" th:action="@{/logout}" method="post" class="d-flex align-items-center gap-2">
        <span class="navbar-text text-light" th:text="${nav.username}">user</span>
        <button class="btn btn-outline-light btn-sm" type="submit">Log out</button>
      </form>
    </div>
  </div>
</nav>
<div th:fragment="messages" class="container">
  <div class="alert alert-success" role="alert" th:if="${message}" th:text="${message}">done</div>
  <div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}">problem</div>
</div>
<th:block th:fragment="scripts">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>
</body>
</html>
