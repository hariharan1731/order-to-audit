<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${table.title})}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div th:replace="~{fragments :: messages}"></div>
<div class="container">
  <div class="d-flex flex-wrap justify-content-between align-items-start mb-3 gap-2">
    <div>
      <h1 class="h4 m-0" th:text="${table.title}">Report</h1>
      <div class="text-muted small" th:text="${table.subtitle}">period</div>
    </div>
    <div class="btn-group">
      <a class="btn btn-outline-secondary btn-sm" th:href="@{${downloadBase + 'csv'}}">CSV</a>
      <a class="btn btn-outline-secondary btn-sm" th:href="@{${downloadBase + 'xlsx'}}">Excel</a>
      <a class="btn btn-outline-secondary btn-sm" th:href="@{${downloadBase + 'pdf'}}">PDF</a>
    </div>
  </div>
  <div th:replace="~{reports/table :: htmlTable(${table})}"></div>
  <a class="btn btn-link mt-2" th:href="@{/reports}">&larr; All reports</a>
</div>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
