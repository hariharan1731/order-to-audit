<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Order')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div th:replace="~{fragments :: messages}"></div>
<div class="container" style="max-width: 760px;">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 m-0" th:text="'Order #' + ${order.summary.id}">Order #1</h1>
    <span class="badge fs-6" th:classappend="'status-' + ${order.summary.status}" th:text="${order.summary.status}">SUBMITTED</span>
  </div>
  <div class="card p-3 mb-3">
    <div><strong th:text="${order.summary.customerName}">Retailer A</strong></div>
    <div class="text-muted small">
      Placed by <span th:text="${order.summary.salesman}">ravi</span> on
      <span th:text="${@fmt.dateTime(order.summary.createdAt)}">date</span>
    </div>
    <div class="small mt-1" th:if="${order.note}">Note: <span th:text="${order.note}">note</span></div>
    <div class="small mt-1 text-danger" th:if="${order.rejectReason}">Rejected: <span th:text="${order.rejectReason}">reason</span></div>
  </div>
  <div class="table-responsive card p-2">
    <table class="table mb-0">
      <thead><tr><th>Product</th><th class="text-end">Packets</th><th class="text-end">Price</th><th class="text-end">Amount</th></tr></thead>
      <tbody>
        <tr th:each="l : ${order.lines}">
          <td th:text="${l.itemName}">Murukku 200 g</td>
          <td class="text-end" th:text="${@fmt.number(l.quantity)}">150</td>
          <td class="text-end money" th:text="${@fmt.rupees(l.unitPricePaise)}">Rs 50.00</td>
          <td class="text-end money" th:text="${@fmt.rupees(l.lineTotalPaise)}">Rs 7,500.00</td>
        </tr>
      </tbody>
      <tfoot><tr><th colspan="3" class="text-end">Total before GST</th>
        <th class="text-end money" th:text="${@fmt.rupees(order.summary.totalPaise)}">Rs 7,500.00</th></tr></tfoot>
    </table>
  </div>
  <a class="btn btn-link mt-2" th:href="@{/sales/orders}">&larr; My orders</a>
</div>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
