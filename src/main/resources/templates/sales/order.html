<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Order')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div th:replace="~{fragments :: messages}"></div>
<div class="container-xxl" style="max-width: 860px;"
     th:with="st=${order.summary.status.name()},
              done2=${st == 'APPROVED' or st == 'INVOICED' or st == 'DISPATCHED'},
              done3=${st == 'INVOICED' or st == 'DISPATCHED'},
              done4=${st == 'DISPATCHED'}">

  <div class="oa-page-head">
    <div>
      <h1 th:text="'Order #' + ${order.summary.id}">Order #1</h1>
      <div class="oa-sub">
        <span th:text="${order.summary.customerName}">Retailer A</span> &middot;
        placed by <span th:text="${order.summary.salesman}">ravi</span> on
        <span th:text="${@fmt.dateTime(order.summary.createdAt)}">date</span>
      </div>
    </div>
    <div class="d-flex align-items-center gap-2">
      <span th:replace="~{fragments :: statusBadge(${order.summary.status})}"></span>
      <a class="btn btn-sm btn-outline-secondary" th:href="@{/sales/orders}">
        <i class="bi bi-arrow-left me-1"></i>My orders</a>
    </div>
  </div>

  <div class="oa-steps card mb-3" th:unless="${st == 'REJECTED'}">
    <div class="oa-step is-done"><i class="bi bi-check-circle-fill"></i> Submitted</div>
    <div class="oa-step" th:classappend="${done2} ? 'is-done'"><i class="bi bi-check-circle-fill"></i> Approved</div>
    <div class="oa-step" th:classappend="${done3} ? 'is-done'"><i class="bi bi-check-circle-fill"></i> Invoiced</div>
    <div class="oa-step" th:classappend="${done4} ? 'is-done'"><i class="bi bi-check-circle-fill"></i> Dispatched</div>
  </div>

  <div class="alert alert-danger" th:if="${order.rejectReason}">
    <i class="bi bi-x-circle-fill"></i><span>Rejected: <span th:text="${order.rejectReason}">reason</span></span>
  </div>

  <div class="oa-table-card mb-3">
    <div class="oa-card-head">
      <span><i class="bi bi-box-seam me-1"></i>What you ordered</span>
      <span class="small text-muted" th:if="${order.summary.invoiceNumber}" th:text="${order.summary.invoiceNumber}">INV/2026-27/0001</span>
    </div>
    <div class="table-responsive">
      <table class="table align-middle">
        <thead><tr><th>Product</th><th class="text-end">Packets</th><th class="text-end">Price</th><th class="text-end">Amount</th></tr></thead>
        <tbody>
          <tr th:each="l : ${order.lines}">
            <td th:text="${l.itemName}">Murukku 200 g</td>
            <td class="text-end" th:text="${@fmt.number(l.quantity)}">150</td>
            <td class="text-end money" th:text="${@fmt.rupees(l.unitPricePaise)}">Rs 50.00</td>
            <td class="text-end money" th:text="${@fmt.rupees(l.lineTotalPaise)}">Rs 7,500.00</td>
          </tr>
        </tbody>
        <tfoot>
          <tr><th colspan="3" class="text-end">Total before GST</th>
            <th class="text-end money" th:text="${@fmt.rupees(order.summary.totalPaise)}">Rs 7,500.00</th></tr>
          <tr><th colspan="3" class="text-end fw-normal text-muted">GST
            <span class="oa-sub-cell" th:if="${order.summary.gstEstimated()}">(expected)</span></th>
            <th class="text-end money fw-normal" th:text="${@fmt.rupees(order.summary.gstPaise)}">Rs 375.00</th></tr>
          <tr><th colspan="3" class="text-end">Total</th>
            <th class="text-end money" th:text="${@fmt.rupees(order.summary.totalWithGstPaise)}">Rs 7,875.00</th></tr>
        </tfoot>
      </table>
    </div>
  </div>

  <div class="card p-3" th:if="${order.note}">
    <div class="small text-muted">Your note</div>
    <div th:text="${order.note}">note</div>
  </div>
</div>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
