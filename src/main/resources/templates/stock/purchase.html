<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Record purchase')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div th:replace="~{fragments :: messages}"></div>
<div class="container-xxl">
  <h1 class="h4 mb-3">Record a purchase</h1>
  <form class="card p-3 mb-4" method="post" th:action="@{/stock/purchases}">
    <div class="row g-3">
      <div class="col-md-4"><label class="form-label" for="supplierId">Supplier</label>
        <select class="form-select" id="supplierId" name="supplierId">
          <option th:each="s : ${suppliers}" th:value="${s.id}" th:text="${s.name}">Supplier</option>
        </select></div>
      <div class="col-md-3"><label class="form-label" for="purchaseDate">Date</label>
        <input class="form-control" type="date" id="purchaseDate" name="purchaseDate" th:value="${today}"></div>
      <div class="col-md-5"><label class="form-label" for="reference">Bill / reference</label>
        <input class="form-control" id="reference" name="reference"></div>
    </div>
    <table class="table mt-3 align-middle">
      <thead><tr><th>Item</th><th>Quantity (kg / L / pcs)</th><th>Rate (Rs per same unit)</th></tr></thead>
      <tbody>
        <tr th:each="n : ${rows}">
          <td><select class="form-select" name="itemId" th:id="'itemId-' + ${n}">
            <option value="">-</option>
            <option th:each="b : ${buyable}" th:value="${b.id}" th:text="${b.name} + ' (' + ${b.unit} + ')'">Flour (kg)</option>
          </select></td>
          <td><input class="form-control" name="quantity" th:id="'quantity-' + ${n}"></td>
          <td><input class="form-control" name="rate" th:id="'rate-' + ${n}"></td>
        </tr>
      </tbody>
    </table>
    <div><button class="btn btn-primary" id="save-purchase" type="submit">Save purchase</button></div>
  </form>

  <h2 class="h6">Add a supplier</h2>
  <form class="card p-3" method="post" th:action="@{/stock/purchases/suppliers}">
    <div class="row g-3">
      <div class="col-md-4"><label class="form-label" for="name">Name</label><input class="form-control" id="name" name="name" required></div>
      <div class="col-md-3"><label class="form-label" for="gstin">GSTIN (optional)</label><input class="form-control" id="gstin" name="gstin"></div>
      <div class="col-md-2"><label class="form-label" for="stateCode">State code</label><input class="form-control" id="stateCode" name="stateCode" value="33" required></div>
      <div class="col-md-3"><label class="form-label" for="address">Address</label><input class="form-control" id="address" name="address"></div>
    </div>
    <div class="mt-3"><button class="btn btn-outline-primary" type="submit">Add supplier</button></div>
  </form>
</div>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
