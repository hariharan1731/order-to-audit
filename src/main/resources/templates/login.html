<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Log in')}"></head>
<body>
<div class="container" style="max-width: 420px; margin-top: 12vh;">
  <div class="card p-4">
    <h1 class="h4 mb-1">Order to Audit</h1>
    <p class="text-muted">Murukku manufacturing and sales</p>
    <div class="alert alert-danger" th:if="${param.error}">Wrong username or password.</div>
    <div class="alert alert-info" th:if="${param.logout}">You have been logged out.</div>
    <form th:action="@{/login}" method="post">
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input id="username" name="username" class="form-control form-control-lg" autocomplete="username" autofocus required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input id="password" name="password" type="password" class="form-control form-control-lg"
               autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary btn-lg w-100" type="submit">Log in</button>
    </form>
  </div>
</div>
</body>
</html>
