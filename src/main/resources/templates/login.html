<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Log in')}"></head>
<body class="oa-login">
<div class="oa-login-box">
  <div class="card p-4">
    <div class="oa-brand oa-brand-dark mb-3">
      <span class="oa-logo"><i class="bi bi-boxes"></i></span>
      <span>
        <span class="oa-name">Order to Audit</span>
        <span class="oa-tagline">Factory &amp; order management</span>
      </span>
    </div>
    <div class="alert alert-danger" th:if="${param.error}">
      <i class="bi bi-exclamation-triangle-fill"></i><span>Wrong username or password.</span></div>
    <div class="alert alert-danger" th:if="${param.disabled}">
      <i class="bi bi-exclamation-triangle-fill"></i><span>Your account has been disabled. Please contact the office.</span></div>
    <div class="alert alert-success" th:if="${param.logout}">
      <i class="bi bi-check-circle-fill"></i><span>You have been logged out.</span></div>
    <form th:action="@{/login}" method="post">
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input id="username" name="username" class="form-control form-control-lg" autocomplete="username" autofocus required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input id="password" name="password" type="password" class="form-control form-control-lg"
               autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary btn-lg w-100" type="submit">
        <i class="bi bi-box-arrow-in-right me-1"></i>Log in</button>
    </form>
  </div>
  <p class="text-center small text-muted mt-3 mb-0">Murukku manufacturing and sales</p>
</div>
</body>
</html>
