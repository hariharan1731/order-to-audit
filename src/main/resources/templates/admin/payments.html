<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Payments')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div th:replace="~{fragments :: messages}"></div>
<div class="container">
  <h1 class="h4 mb-3">Payments</h1>
  <p class="text-muted" th:if="${#lists.isEmpty(debtors)}">Nobody owes anything right now.</p>
  <div class="table-responsive card p-2" th:unless="${#lists.isEmpty(debtors)}">
    <table class="table table-hover mb-0 align-middle">
      <thead><tr><th>Customer</th><th class="text-end">Outstanding</th><th></th></tr></thead>
      <tbody>
        <tr th:each="d : ${debtors}">
          <td th:text="${d.name}">Retailer A</td>
          <td class="text-end money" th:text="${@fmt.rupees(d.outstandingPaise)}">Rs 3,875.00</td>
          <td class="text-end"><a class="btn btn-sm btn-primary" th:href="@{/admin/payments/customers/{id}(id=${d.customerId})}">Record payment</a></td>
        </tr>
      </tbody>
      <tfoot><tr><th>Total</th><th class="text-end money" th:text="${@fmt.rupees(total)}">x</th><th></th></tr></tfoot>
    </table>
  </div>
</div>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
