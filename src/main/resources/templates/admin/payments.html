<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Payments')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div th:replace="~{fragments :: messages}"></div>
<div class="container-xxl">
  <div class="oa-page-head">
    <div>
      <h1>Payments</h1>
      <div class="oa-sub">Customers with unpaid invoices. A payment is applied to the oldest invoice first.</div>
    </div>
    <div class="d-flex flex-wrap gap-2" th:if="${nav.reports}">
      <a class="btn btn-outline-secondary" th:href="@{/reports/outstanding}"><i class="bi bi-hourglass-bottom me-1" aria-hidden="true"></i>Ageing report</a>
      <a class="btn btn-outline-secondary" th:href="@{/reports/collections}"><i class="bi bi-journal-check me-1" aria-hidden="true"></i>Payment history</a>
    </div>
  </div>

  <div class="oa-stats" id="payments-summary">
    <div class="oa-stat" th:classappend="${total > 0} ? 'is-bad' : 'is-approved'">
      <span class="oa-stat-label"><i class="bi bi-cash-stack"></i> Total outstanding</span>
      <span class="oa-stat-value money" th:text="${@fmt.rupees(total)}">Rs 0.00</span>
    </div>
    <div class="oa-stat is-pending">
      <span class="oa-stat-label"><i class="bi bi-people"></i> Customers owing</span>
      <span class="oa-stat-value" th:text="${#lists.size(debtors)}">0</span>
    </div>
  </div>

  <div class="oa-table-card" th:if="${#lists.isEmpty(debtors)}">
    <div th:replace="~{fragments :: empty('bi-emoji-smile', 'Nobody owes anything right now.', 'Every invoice is fully paid.')}"></div>
  </div>
  <div class="oa-table-card table-responsive" th:unless="${#lists.isEmpty(debtors)}">
    <table class="table table-hover mb-0 align-middle">
      <thead><tr><th>Customer</th><th>Status</th><th class="text-end">Outstanding</th><th></th></tr></thead>
      <tbody>
        <tr th:each="d : ${debtors}">
          <td class="fw-semibold" th:text="${d.name}">Retailer A</td>
          <td><span class="badge oa-badge status-PENDING"><i class="bi bi-hourglass-split" aria-hidden="true"></i>Payment due</span></td>
          <td class="text-end money" th:text="${@fmt.rupees(d.outstandingPaise)}">Rs 3,875.00</td>
          <td class="text-end"><a class="btn btn-sm btn-primary" th:href="@{/admin/payments/customers/{id}(id=${d.customerId})}"><i class="bi bi-plus-circle me-1" aria-hidden="true"></i>Record payment</a></td>
        </tr>
      </tbody>
      <tfoot><tr><th>Total</th><th></th><th class="text-end money" th:text="${@fmt.rupees(total)}">x</th><th></th></tr></tfoot>
    </table>
  </div>
</div>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
