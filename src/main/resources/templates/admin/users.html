<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Users')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div th:replace="~{fragments :: messages}"></div>
<div class="container">
  <h1 class="h4 mb-3">Users</h1>
  <div class="table-responsive card p-2 mb-4">
    <table class="table mb-0 align-middle">
      <thead><tr><th>Username</th><th>Name</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody><tr th:each="u : ${users}">
        <td th:text="${u.username}">ravi</td>
        <td th:text="${u.displayName}">Ravi Kumar</td>
        <td th:text="${u.role}">SALESMAN</td>
        <td><span class="badge" th:classappend="${u.enabled} ? 'bg-success' : 'bg-secondary'" th:text="${u.enabled} ? 'Active' : 'Disabled'">Active</span></td>
        <td>
          <form th:action="@{/users/{id}/enabled(id=${u.id})}" method="post" class="d-inline">
            <input type="hidden" name="enabled" th:value="${!u.enabled}">
            <button class="btn btn-sm btn-outline-secondary" type="submit" th:text="${u.enabled} ? 'Disable' : 'Enable'">Disable</button>
          </form>
          <form th:action="@{/users/{id}/password(id=${u.id})}" method="post" class="d-inline-flex gap-1">
            <input type="password" name="password" class="form-control form-control-sm" placeholder="New password" required autocomplete="new-password">
            <button class="btn btn-sm btn-outline-primary" type="submit">Reset</button>
          </form>
        </td>
      </tr></tbody>
    </table>
  </div>
  <form th:action="@{/users}" method="post" class="card p-3">
    <h2 class="h6">Add a user</h2>
    <div class="row g-2">
      <div class="col-6 col-md-3"><label class="form-label small">Username</label><input name="username" class="form-control" required maxlength="50"></div>
      <div class="col-6 col-md-3"><label class="form-label small">Full name</label><input name="displayName" class="form-control" required maxlength="100"></div>
      <div class="col-6 col-md-3"><label class="form-label small">Password</label><input type="password" name="password" class="form-control" required autocomplete="new-password"></div>
      <div class="col-6 col-md-3"><label class="form-label small">Role</label>
        <select name="role" class="form-select"><option th:each="r : ${roles}" th:value="${r}" th:text="${r}">SALESMAN</option></select></div>
    </div>
    <p class="small text-muted mt-2 mb-0">At least 8 characters with a letter and a digit.</p>
    <button class="btn btn-primary mt-3 align-self-start" type="submit">Create user</button>
  </form>
</div>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
