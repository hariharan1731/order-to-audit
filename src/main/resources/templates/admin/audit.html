<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Audit log')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div th:replace="~{fragments :: messages}"></div>
<div class="container">
  <h1 class="h4 mb-3">Audit log</h1>
  <p class="text-muted">Who did what, newest first. This list cannot be edited.</p>
  <div class="table-responsive card p-2">
    <table class="table table-sm mb-0">
      <thead><tr><th>When</th><th>Who</th><th>Action</th><th>On</th><th>Details</th></tr></thead>
      <tbody><tr th:each="e : ${entries}">
        <td class="text-nowrap" th:text="${@fmt.dateTime(e.at.toInstant())}">date</td>
        <td th:text="${e.actor}">admin</td>
        <td><span class="badge bg-dark" th:text="${e.action}">ORDER_APPROVED</span></td>
        <td th:text="${e.entityType} + (${e.entityId} != null ? ' #' + ${e.entityId} : '')">ORDER #1</td>
        <td th:text="${e.details}">details</td>
      </tr></tbody>
    </table>
  </div>
</div>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
