<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Production')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div th:replace="~{fragments :: messages}"></div>
<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">Production runs</h1>
    <a class="btn btn-primary" id="new-run" th:href="@{/production/new}">New run</a>
  </div>
  <div class="table-responsive card p-2">
    <table class="table table-hover mb-0 align-middle">
      <thead><tr><th>#</th><th>Date</th><th>Product</th><th class="text-end">Expected</th><th class="text-end">Good</th>
        <th class="text-end">Yield</th><th class="text-end">Cost / packet</th><th>Status</th><th></th></tr></thead>
      <tbody>
        <tr th:each="r : ${runs}">
          <td th:text="${r.id}">1</td>
          <td th:text="${@fmt.date(r.runDate)}">2026-11-01</td>
          <td th:text="${r.product}">Murukku</td>
          <td class="text-end" th:text="${r.expectedPackets}">200</td>
          <td class="text-end" th:text="${r.goodPackets}">188</td>
          <td class="text-end"><span th:text="${r.yieldVariancePct} + '%'">-6%</span>
            <span class="badge bg-danger" th:if="${r.flagged}">flagged</span></td>
          <td class="text-end money" th:text="${@fmt.rupeesRounded(r.costPerPacket)}">31.14</td>
          <td><span class="badge bg-secondary" th:text="${r.status}">POSTED</span></td>
          <td class="text-end"><a class="btn btn-sm btn-outline-secondary" th:href="@{/production/runs/{id}(id=${r.id})}">Open</a></td>
        </tr>
        <tr th:if="${#lists.isEmpty(runs)}"><td colspan="9" class="text-muted text-center">No runs yet.</td></tr>
      </tbody>
    </table>
  </div>
</div>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
