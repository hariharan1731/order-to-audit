spring:
  application:
    name: order-to-audit
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orderaudit}
    username: ${DB_USER:orderaudit}
    password: ${DB_PASSWORD:orderaudit_dev}
  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only checks that Java matches the database.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
