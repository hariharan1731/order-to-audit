spring:
  application:
    name: order-to-audit
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orderaudit}
    username: ${DB_USER:orderaudit}
    password: ${DB_PASSWORD:orderaudit_dev}
  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only checks that Java matches the database.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  seller:
    # Printed on the invoice PDF. Change these for the real business (env: APP_SELLER_STATE etc.).
    name: ${APP_SELLER_NAME:Murukku Foods (demo)}
    gstin: ${APP_SELLER_GSTIN:33AAAAA0000A1Z5}
    state: ${APP_SELLER_STATE:Tamil Nadu (33)}
