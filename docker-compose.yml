# One command starts the database:  docker compose up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orderaudit
      POSTGRES_USER: orderaudit
      # Password comes from the environment; the default is for local development only.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-orderaudit_dev}
    ports:
      - "5432:5432"
    volumes:
      - orderaudit_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderaudit -d orderaudit"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  orderaudit_data:
