# One command starts everything:  docker compose up --build   (then open http://localhost:8080)
# Only the database (run the app from your IDE):  docker compose up -d db
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orderaudit
      POSTGRES_USER: orderaudit
      # Password comes from the environment; the default is for local development only.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-orderaudit_dev}
    ports:
      - "5432:5432"
    volumes:
      - orderaudit_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderaudit -d orderaudit"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/orderaudit
      DB_USER: orderaudit
      DB_PASSWORD: ${DB_PASSWORD:-orderaudit_dev}
      # Loads the official benchmark data and one demo login per role on first start.
      APP_SEED_ENABLED: "true"
    ports:
      - "8080:8080"

volumes:
  orderaudit_data:
