name: tests

# Runs the unit and integration tests (including the ones that start a throwaway PostgreSQL in Docker)
# on every push to main and on every pull request.
#
# The three-browser Playwright tests (src/test/java/com/orderaudit/browser) are left out here: they need real
# browsers installed on the machine and did not start on GitHub's runner ("Failed to create driver").
# Run them on your own computer with a plain `mvn test`.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run tests (everything except the browser tests)
        run: mvn -B test -Dtest='!**/browser/*Test'

      - name: Keep the test reports if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
